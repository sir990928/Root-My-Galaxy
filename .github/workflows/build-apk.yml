name: 仅构建 S9380ZHU1AYA1 APK（自动签名，不编译漏洞so）

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TARGET: pa3q-S9380ZHU1AYA1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: 还原签名keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > release.jks

      - name: 安装基础工具
        run: sudo apt update && sudo apt install -y zip unzip wget

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: true

      - name: 打包Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --no-configuration-cache

      - name: 自动签名APK
        env:
          STORE_PWD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 获取 build-tools 路径
          BUILD_TOOLS=$ANDROID_HOME/build-tools/37.0.0
          APKSIGNER=$BUILD_TOOLS/apksigner
          
          # 获取 APK 文件
          cd app/build/outputs/apk/release
          APK=$(ls *.apk)
          
          echo "Signing: $APK"
          
          # 签名
          $APKSIGNER sign \
            --ks $GITHUB_WORKSPACE/release.jks \
            --ks-pass pass:$STORE_PWD \
            --ks-key-alias $KEY_ALIAS \
            --key-pass pass:$KEY_PWD \
            $APK
          
          echo "APK signed successfully!"
          
          # 验证签名
          $APKSIGNER verify $APK

      - name: 上传成品APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-App-${{ env.TARGET }}
          retention-days: 30
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk

      - name: 清理密钥文件
        if: always()
        run: rm -f release.jks