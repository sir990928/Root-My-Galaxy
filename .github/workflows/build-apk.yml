name: 仅构建 S9380ZHU1AYA1 APK（自动签名，不编译漏洞so）

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TARGET: pa3q-S9380ZHU1AYA1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: 安装基础工具
        run: sudo apt update && sudo apt install -y zip unzip wget

      - name: 安装 Android SDK & BuildTools
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: true

      - name: 还原签名密钥文件
        env:
          KS_BASE64: ${{ secrets.SIGNING_KEYSTORE }}
        run: echo "$KS_BASE64" | base64 -d > release.jks

      - name: 编译Release包（关闭配置缓存解决native lib序列化报错）
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --no-configuration-cache

      - name: 自动签名APK（修复apksigner找不到，读取SDK完整路径）
        env:
          STORE_PWD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SDK_ROOT=$ANDROID_HOME
          BUILD_TOOLS_VER=$(ls $SDK_ROOT/build-tools | sort -V | tail -1)
          APKSIGNER_BIN="$SDK_ROOT/build-tools/$BUILD_TOOLS_VER/apksigner"
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -1)
          $APKSIGNER_BIN sign \
            --ks release.jks \
            --ks-pass pass:$STORE_PWD \
            --key-pass pass:$KEY_PWD \
            --ks-key-alias $KEY_ALIAS \
            "$APK_FILE"

      - name: 上传已签名成品APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-App-${{ env.TARGET }}
          retention-days: 30
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk

      - name: 清理密钥文件
        if: always()
        run: rm -f release.jks
