name: 仅构建 S9380ZHU1AYA1 APK（自动签名，不编译漏洞so）

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TARGET: pa3q-S9380ZHU1AYA1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: 还原签名keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > release.jks

      - name: 安装基础工具
        run: sudo apt update && sudo apt install -y zip unzip wget

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: true

      - name: 打包Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --no-configuration-cache

      - name: 自动签名APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          
          echo "=== 签名信息 ==="
          echo "APK: $APK"
          
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.jks \
            -storepass ${{ secrets.SIGNING_KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.SIGNING_KEY_PASSWORD }} \
            "$APK" \
            ${{ secrets.SIGNING_KEY_ALIAS }}
          
          echo "=== 验证签名 ==="
          jarsigner -verify -verbose "$APK"
          
          echo "✅ 签名完成"

      - name: 上传成品APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-App-${{ env.TARGET }}
          retention-days: 30
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk

      - name: 清理密钥文件
        if: always()
        run: rm -f release.jks