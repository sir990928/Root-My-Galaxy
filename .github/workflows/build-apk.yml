name: Galaxy-Su 构建发布
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APK_DIR: ${{ github.workspace }}/app/build/outputs/apk/release
  SDK_ROOT: ${{ github.workspace }}/android-sdk
  BUILD_TOOLS_VERSION: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置JDK21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: 还原密钥文件
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: 安装Android SDK & Build Tools（含apksigner）
        run: |
          sudo apt update && sudo apt install unzip -y
          mkdir -p $SDK_ROOT/cmdline-tools
          cd $SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-11076708_latest.zip -d latest
          echo "export PATH=$SDK_ROOT/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
          echo "y" | sdkmanager --sdk_root=$SDK_ROOT "build-tools;$BUILD_TOOLS_VERSION"
          echo "APKSIGNER=$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" >> $GITHUB_ENV

      - name: Gradle编译无签名Release包
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 自动获取APK路径
        run: |
          ls -la $APK_DIR
          APK_FILE=$(ls $APK_DIR/*.apk | head -n1)
          echo "FINAL_APK=$APK_FILE" >> $GITHUB_ENV

      - name: apksigner 签名成品
        run: |
          ${{ env.APKSIGNER }} sign \
            --ks release.jks \
            --ks-pass pass:${{ secrets.SIGNING_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.SIGNING_KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.SIGNING_KEY_ALIAS }} \
            ${{ env.FINAL_APK }}

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: Root-My-Galaxy-v0.2.6
          path: ${{ env.FINAL_APK }}

      - name: 清理密钥文件
        run: rm -f release.jks
