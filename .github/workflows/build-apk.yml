name: 仅构建 S9380ZHU1AYA1 APK（自动签名，不编译漏洞so）

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TARGET: Samsung-root

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: 还原签名keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > release.jks

      - name: 安装基础工具
        run: sudo apt update && sudo apt install -y zip unzip wget

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: true

      - name: 打包Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --no-configuration-cache

      - name: 自动签名并对齐APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          
          echo "=== 签名信息 ==="
          echo "原始APK: $APK"
          
          # 先做4字节对齐
          echo "=== 4字节对齐 ==="
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort | tail -1)
          echo "zipalign: $ZIPALIGN"
          $ZIPALIGN -v -p 4 "$APK" "$ALIGNED_APK"
          
          echo "=== 验证对齐 ==="
          $ZIPALIGN -c -v 4 "$ALIGNED_APK"
          
          # 使用 apksigner 进行 V2+V3 签名
          echo "=== V2+V3签名 ==="
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          
          $APKSIGNER sign \
            --ks release.jks \
            --ks-pass pass:${{ secrets.SIGNING_KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.SIGNING_KEY_ALIAS }} \
            --key-pass pass:${{ secrets.SIGNING_KEY_PASSWORD }} \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$ALIGNED_APK"
          
          echo "=== 验证签名 ==="
          $APKSIGNER verify --verbose "$ALIGNED_APK"
          
          # 替换原文件
          rm -f "$APK"
          mv "$ALIGNED_APK" "$APK"
          
          echo "✅ V2+V3签名和对齐完成"

      - name: 上传成品APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-App-${{ env.TARGET }}
          retention-days: 30
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk

      - name: 清理密钥文件
        if: always()
        run: rm -f release.jks